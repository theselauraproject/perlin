app-id: io.perlin.client
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: perlin
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio

  - --device=all

  - --filesystem=xdg-download:ro
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/pkgconfig
  - '*.a'
modules:
  - name: perlin
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      build-args:
        - --share=network
      env:
        CPM_SOURCE_CACHE: /run/build/perlin/.cpm-cache
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPERLIN_BUILD_TESTS=OFF

      - -DOPENSSL_USE_STATIC_LIBS=OFF
    post-install:

      - install -d /app/bin
      - ln -sf /app/Perlin /app/bin/perlin
      - install -Dm644 /run/build/perlin/packaging/flatpak/io.perlin.client.metainfo.xml /app/share/metainfo/io.perlin.client.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-flatpak
          - .flatpak-builder
          - .cpm-cache
